# Set prefix to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Allow 256/24bit colors
set -g default-terminal "xterm-256color"
set -ga terminal-overrides "xterm*:Tc"

# Statusbar text
set -g status-interval 1

# Don't mess up with Vim
set -sg escape-time 0

# Mouse stuff
set -g mouse on
bind -n WheelUpPane   select-pane -t= \; copy-mode -e \; send-keys -M
bind -n WheelDownPane select-pane -t= \;                 send-keys -M

# ctrl-arrows changes window
bind-key -n C-left prev
bind-key -n C-right next

# Fix 'home' and 'end' key not working
bind -n End send-key C-e
bind -n Home send-key C-a

# Start window indices at 1
set -g base-index 1

# Enable window titles in terminal app
set -g set-titles on

# Enable notifications
setw -g monitor-activity on

# Load plugins (https://github.com/tmuxpack/tpack)
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'dracula/tmux'
set -g @dracula-plugins " "
set -g @dracula-show-left-icon "#h"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
